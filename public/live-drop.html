<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPH Live Drop</title>
<script src="/socket.io/socket.io.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: transparent;
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    overflow: hidden;
  }

  .feed {
    display: flex;
    gap: 10px;
    padding: 6px 10px;
    overflow-x: auto;
    scrollbar-width: none;
    height: 210px;
    align-items: stretch;
  }
  .feed::-webkit-scrollbar { display: none; }

  /* ── Card base: frosted glass + rarity color ── */
  .card {
    flex: 0 0 280px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    animation: slideIn 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    position: relative;
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
  }
  .card:hover { transform: translateY(-3px) scale(1.01); }

  /* Neon accent strip — top edge */
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    border-radius: 14px 14px 0 0;
    z-index: 2;
  }

  /* ── Rarity tiers: vibrant backgrounds + glow + neon strip ── */
  .card.rarity-consumer {
    background: linear-gradient(135deg, rgba(176,195,217,0.30) 0%, rgba(100,120,150,0.15) 50%, rgba(12,15,28,0.85) 100%);
    border-color: rgba(176,195,217,0.25);
    box-shadow: 0 4px 20px rgba(176,195,217,0.10), inset 0 0 30px rgba(176,195,217,0.05);
  }
  .card.rarity-consumer::before { background: linear-gradient(90deg, #b0c3d9, #8a9bb5); }
  .card.rarity-consumer:hover { box-shadow: 0 6px 28px rgba(176,195,217,0.18), inset 0 0 30px rgba(176,195,217,0.08); }

  .card.rarity-industrial {
    background: linear-gradient(135deg, rgba(94,152,217,0.35) 0%, rgba(50,100,180,0.18) 50%, rgba(12,15,28,0.85) 100%);
    border-color: rgba(94,152,217,0.30);
    box-shadow: 0 4px 22px rgba(94,152,217,0.12), inset 0 0 30px rgba(94,152,217,0.06);
  }
  .card.rarity-industrial::before { background: linear-gradient(90deg, #5e98d9, #3d7cc7); }
  .card.rarity-industrial:hover { box-shadow: 0 6px 30px rgba(94,152,217,0.22), inset 0 0 30px rgba(94,152,217,0.10); }

  .card.rarity-milspec {
    background: linear-gradient(135deg, rgba(75,105,255,0.40) 0%, rgba(50,70,200,0.20) 50%, rgba(12,15,28,0.85) 100%);
    border-color: rgba(75,105,255,0.35);
    box-shadow: 0 4px 24px rgba(75,105,255,0.15), inset 0 0 35px rgba(75,105,255,0.07);
  }
  .card.rarity-milspec::before { background: linear-gradient(90deg, #4b69ff, #3a52e0); }
  .card.rarity-milspec:hover { box-shadow: 0 6px 32px rgba(75,105,255,0.25), inset 0 0 35px rgba(75,105,255,0.12); }

  .card.rarity-restricted {
    background: linear-gradient(135deg, rgba(136,71,255,0.42) 0%, rgba(100,40,220,0.22) 50%, rgba(12,15,28,0.85) 100%);
    border-color: rgba(136,71,255,0.40);
    box-shadow: 0 4px 26px rgba(136,71,255,0.18), inset 0 0 35px rgba(136,71,255,0.08);
  }
  .card.rarity-restricted::before { background: linear-gradient(90deg, #8847ff, #6c2de0); }
  .card.rarity-restricted:hover { box-shadow: 0 6px 34px rgba(136,71,255,0.28), inset 0 0 35px rgba(136,71,255,0.14); }

  .card.rarity-classified {
    background: linear-gradient(135deg, rgba(211,44,230,0.45) 0%, rgba(170,20,190,0.25) 50%, rgba(12,15,28,0.85) 100%);
    border-color: rgba(211,44,230,0.45);
    box-shadow: 0 4px 28px rgba(211,44,230,0.20), inset 0 0 40px rgba(211,44,230,0.08);
  }
  .card.rarity-classified::before { background: linear-gradient(90deg, #d32ce6, #b018c7); }
  .card.rarity-classified:hover { box-shadow: 0 6px 36px rgba(211,44,230,0.32), inset 0 0 40px rgba(211,44,230,0.14); }

  .card.rarity-covert {
    background: linear-gradient(135deg, rgba(235,75,75,0.48) 0%, rgba(200,40,40,0.28) 50%, rgba(12,15,28,0.85) 100%);
    border-color: rgba(235,75,75,0.45);
    box-shadow: 0 4px 30px rgba(235,75,75,0.22), inset 0 0 40px rgba(235,75,75,0.08);
  }
  .card.rarity-covert::before { background: linear-gradient(90deg, #eb4b4b, #c73030); }
  .card.rarity-covert:hover { box-shadow: 0 8px 40px rgba(235,75,75,0.35), inset 0 0 40px rgba(235,75,75,0.15); }

  /* Covert pulse glow */
  .card.rarity-covert::after {
    content: '';
    position: absolute;
    inset: -1px;
    border-radius: 14px;
    background: transparent;
    box-shadow: inset 0 0 20px rgba(235,75,75,0.15);
    animation: covertPulse 2.5s ease-in-out infinite;
    pointer-events: none;
    z-index: 1;
  }

  .card.rarity-gold {
    background: linear-gradient(135deg, rgba(255,215,0,0.50) 0%, rgba(220,170,0,0.30) 50%, rgba(12,15,28,0.85) 100%);
    border-color: rgba(255,215,0,0.55);
    box-shadow: 0 4px 32px rgba(255,215,0,0.25), 0 0 60px rgba(255,215,0,0.08), inset 0 0 45px rgba(255,215,0,0.08);
  }
  .card.rarity-gold::before {
    background: linear-gradient(90deg, #ffd700, #ffaa00, #ffd700);
    height: 4px;
    animation: neonPulse 2s ease-in-out infinite;
  }
  .card.rarity-gold:hover {
    box-shadow: 0 8px 44px rgba(255,215,0,0.38), 0 0 70px rgba(255,215,0,0.12), inset 0 0 45px rgba(255,215,0,0.12);
    border-color: rgba(255,215,0,0.70);
  }

  /* Gold shimmer sweep */
  .card.rarity-gold::after {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 50%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,215,0,0.10), transparent);
    animation: sweep 3s ease-in-out infinite;
    pointer-events: none;
    border-radius: 14px;
    z-index: 1;
  }

  @keyframes neonPulse {
    0%, 100% { opacity: 1; filter: brightness(1); }
    50% { opacity: 0.7; filter: brightness(1.4); }
  }

  @keyframes sweep {
    0% { left: -100%; }
    100% { left: 200%; }
  }

  @keyframes covertPulse {
    0%, 100% { box-shadow: inset 0 0 20px rgba(235,75,75,0.10); }
    50% { box-shadow: inset 0 0 30px rgba(235,75,75,0.22); }
  }

  .card-case-name {
    font-size: 9px;
    color: rgba(255,255,255,0.40);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 90px;
    letter-spacing: 0.4px;
    text-transform: uppercase;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-30px) scale(0.95); }
    to   { opacity: 1; transform: translateX(0) scale(1); }
  }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px 6px;
    gap: 8px;
  }

  .card-user {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
    flex: 1;
  }

  .card-avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    flex-shrink: 0;
    object-fit: cover;
    background: rgba(255,255,255,0.05);
    border: 1.5px solid rgba(255,255,255,0.10);
  }

  .card-username {
    font-size: 12px;
    font-weight: 600;
    color: rgba(255,255,255,0.88);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    letter-spacing: 0.2px;
  }

  .card-stats {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    flex-shrink: 0;
    gap: 2px;
  }

  .card-multiplier {
    font-size: 15px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.3px;
  }

  .card-pf {
    font-size: 10px;
    color: rgba(255,255,255,0.30);
    font-variant-numeric: tabular-nums;
    font-family: 'Consolas', 'SF Mono', 'Courier New', monospace;
    letter-spacing: 0.5px;
  }

  .card-pf.fire {
    color: #ff7a30;
    text-shadow: 0 0 8px rgba(255,122,48,0.45);
  }

  .card-items {
    display: flex;
    flex: 1;
    padding: 2px 10px 10px;
    gap: 6px;
    align-items: center;
  }

  .card-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    min-width: 0;
    position: relative;
  }

  /* Arrow separator between items */
  .card-items > .card-item:first-child:not(:last-child)::after {
    content: '›';
    position: absolute;
    right: -9px;
    top: 45%;
    transform: translateY(-50%);
    font-size: 24px;
    color: rgba(255,255,255,0.15);
    font-weight: 200;
    pointer-events: none;
  }

  .card-item-img {
    width: 95px;
    height: 65px;
    object-fit: contain;
    filter: drop-shadow(0 2px 8px rgba(0,0,0,0.35));
    transition: transform 0.2s ease;
  }
  .card:hover .card-item-img { transform: scale(1.05); }

  .card-item-name {
    font-size: 10px;
    font-weight: 500;
    color: rgba(255,255,255,0.60);
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
    line-height: 1.2;
  }

  .card-item-price {
    font-size: 12px;
    font-weight: 700;
    color: rgba(255,255,255,0.90);
    letter-spacing: 0.3px;
  }

  .empty {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    color: rgba(255,255,255,0.3);
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div class="feed" id="feed">
  <div class="empty" id="empty-msg">Aguardando resultados...</div>
</div>

<script>
(function () {
  var feed = document.getElementById('feed');
  var emptyMsg = document.getElementById('empty-msg');
  var MAX_CARDS = 20;

  function colorToRgba(color, alpha) {
    var m = color.match(/rgb\(\s*(\d+),\s*(\d+),\s*(\d+)\s*\)/);
    if (m) return 'rgba(' + m[1] + ',' + m[2] + ',' + m[3] + ',' + alpha + ')';
    if (color.charAt(0) === '#') {
      var hex = color.replace('#', '');
      if (hex.length === 3) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
      var r = parseInt(hex.substr(0,2), 16);
      var g = parseInt(hex.substr(2,2), 16);
      var b = parseInt(hex.substr(4,2), 16);
      return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
    }
    return color;
  }

  function getRarityClass(entry) {
    var itemName = (entry.itemTo && entry.itemTo.name) ? entry.itemTo.name : '';
    var toPrice = 0;
    if (entry.itemTo && entry.itemTo.price) {
      toPrice = parseFloat(String(entry.itemTo.price).replace(/[^0-9.,]/g, '').replace(',', '.')) || 0;
    }
    // Knives/gloves = gold
    if (itemName.indexOf('\u2605') !== -1 || itemName.indexOf('Knife') !== -1 || itemName.indexOf('Gloves') !== -1 || itemName.indexOf('Bayonet') !== -1 || itemName.indexOf('Karambit') !== -1 || itemName.indexOf('Butterfly') !== -1 || itemName.indexOf('Talon') !== -1 || itemName.indexOf('Skeleton') !== -1 || itemName.indexOf('Navaja') !== -1 || itemName.indexOf('Stiletto') !== -1 || itemName.indexOf('Ursus') !== -1 || itemName.indexOf('Bowie') !== -1 || itemName.indexOf('Falchion') !== -1 || itemName.indexOf('Huntsman') !== -1 || itemName.indexOf('Gut Knife') !== -1 || itemName.indexOf('Flip Knife') !== -1 || itemName.indexOf('M9 Bayonet') !== -1 || itemName.indexOf('Kukri') !== -1) {
      return 'rarity-gold';
    }
    if (toPrice >= 300) return 'rarity-gold';
    if (toPrice >= 80) return 'rarity-covert';
    if (toPrice >= 25) return 'rarity-classified';
    if (toPrice >= 8) return 'rarity-restricted';
    if (toPrice >= 2) return 'rarity-milspec';
    if (toPrice >= 0.5) return 'rarity-industrial';
    return 'rarity-consumer';
  }

  function createCard(entry) {
    var card = document.createElement('div');
    card.className = 'card ' + getRarityClass(entry);

    var isCase = entry.type === 'case';
    var pfClass = entry.pfRoll && entry.pfRoll >= 9000000 ? ' fire' : '';
    var pfText = entry.pfRoll ? String(Math.round(entry.pfRoll)) : '';

    var caseNameHtml = '';
    if (isCase && entry.caseName) {
      var prettyCase = entry.caseName.replace(/-/g, ' ').replace(/\b\w/g, function(c) { return c.toUpperCase(); });
      caseNameHtml = '<span class="card-case-name">' + prettyCase + '</span>';
    }

    var fromHtml = '';
    var toHtml = '';

    if (entry.itemFrom) {
      fromHtml = '<div class="card-item">'
        + (entry.itemFrom.image ? '<img class="card-item-img" src="' + entry.itemFrom.image + '" alt="">' : '')
        + '<div class="card-item-name">' + (entry.itemFrom.name || '') + '</div>'
        + '<div class="card-item-price">$ ' + (entry.itemFrom.price || '0.00') + '</div>'
        + '</div>';
    }

    if (entry.itemTo) {
      toHtml = '<div class="card-item">'
        + (entry.itemTo.image ? '<img class="card-item-img" src="' + entry.itemTo.image + '" alt="">' : '')
        + '<div class="card-item-name">' + (entry.itemTo.name || '') + '</div>'
        + '<div class="card-item-price">$ ' + (entry.itemTo.price || '0.00') + '</div>'
        + '</div>';
    }

    card.innerHTML = '<div class="card-header">'
      + '<div class="card-user">'
      + (entry.avatar ? '<img class="card-avatar" src="' + entry.avatar + '" alt="">' : '<div class="card-avatar"></div>')
      + '<span class="card-username">' + (entry.username || 'Anônimo') + '</span>'
      + '</div>'
      + '<div class="card-stats">'
      + '<span class="card-multiplier">' + (entry.multiplier || '') + '</span>'
      + caseNameHtml
      + (pfText ? '<span class="card-pf' + pfClass + '">' + pfText + '</span>' : '')
      + '</div>'
      + '</div>'
      + '<div class="card-items">' + fromHtml + toHtml + '</div>';

    return card;
  }

  function addCard(entry) {
    if (emptyMsg) { emptyMsg.remove(); emptyMsg = null; }

    var card = createCard(entry);
    feed.insertBefore(card, feed.firstChild);

    // Remove excess cards
    while (feed.children.length > MAX_CARDS) {
      feed.removeChild(feed.lastChild);
    }
  }

  // Connect to Socket.IO
  var socket = io({ transports: ['websocket', 'polling'] });

  socket.on('connect', function () {
    console.log('CPH LiveDrop connected');
  });

  socket.on('new-roll', function (entry) {
    addCard(entry);
  });

  // Load existing rolls on page load
  fetch('/api/rolls')
    .then(function (res) { return res.json(); })
    .then(function (data) {
      if (data && data.length) {
        // Reverse so oldest appears first, then newest slides in
        data.slice().reverse().forEach(function (entry) {
          addCard(entry);
        });
      }
    })
    .catch(function (err) {
      console.error('Failed to load rolls:', err);
    });
})();
</script>
</body>
</html>
