<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPH Live Drop</title>
<script src="/socket.io/socket.io.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: transparent;
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    overflow: hidden;
  }

  .feed {
    display: flex;
    gap: 12px;
    padding: 8px 12px;
    overflow-x: auto;
    scrollbar-width: none;
    height: 210px;
    align-items: stretch;
  }
  .feed::-webkit-scrollbar { display: none; }

  .card {
    flex: 0 0 280px;
    background: #0d1220;
    border: 2px solid #1e2339;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    animation: slideIn 0.4s ease;
    transition: border-color 0.3s;
  }

  .card.high-value { border-color: #ff4f67; background: linear-gradient(135deg, #1a0a0e, #0d1220 60%); }
  .card.mid-value  { border-color: #ffc700; background: linear-gradient(135deg, #1a1508, #0d1220 60%); }
  .card.low-value  { border-color: #13cdff; background: linear-gradient(135deg, #081520, #0d1220 60%); }

  /* CS:GO rarity tiers */
  .card.rarity-consumer    { border-color: #b0c3d9; background: linear-gradient(135deg, rgba(176,195,217,0.12), #0d1220 60%); }
  .card.rarity-industrial  { border-color: #5e98d9; background: linear-gradient(135deg, rgba(94,152,217,0.12), #0d1220 60%); }
  .card.rarity-milspec     { border-color: #4b69ff; background: linear-gradient(135deg, rgba(75,105,255,0.15), #0d1220 60%); }
  .card.rarity-restricted  { border-color: #8847ff; background: linear-gradient(135deg, rgba(136,71,255,0.15), #0d1220 60%); }
  .card.rarity-classified  { border-color: #d32ce6; background: linear-gradient(135deg, rgba(211,44,230,0.15), #0d1220 60%); }
  .card.rarity-covert      { border-color: #eb4b4b; background: linear-gradient(135deg, rgba(235,75,75,0.18), #0d1220 60%); }
  .card.rarity-gold        { border-color: #ffd700; background: linear-gradient(135deg, rgba(255,215,0,0.15), #0d1220 60%); box-shadow: 0 0 12px rgba(255,215,0,0.15); }

  .card-case-name {
    font-size: 9px;
    color: #ffc700;
    opacity: 0.85;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 80px;
  }

  .card-type-badge {
    font-size: 9px;
    font-weight: 700;
    padding: 1px 5px;
    border-radius: 3px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .card-badge-upgrade { background: rgba(19,205,255,0.15); color: #13cdff; }
  .card-badge-case    { background: rgba(255,199,0,0.15); color: #ffc700; }

  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-30px) scale(0.95); }
    to   { opacity: 1; transform: translateX(0) scale(1); }
  }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 10px;
    gap: 8px;
  }

  .card-user {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }

  .card-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    flex-shrink: 0;
    object-fit: cover;
    background: #1e2339;
  }

  .card-username {
    font-size: 12px;
    font-weight: 600;
    color: #b7bcdb;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .card-stats {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    flex-shrink: 0;
  }

  .card-multiplier {
    font-size: 14px;
    font-weight: 700;
    color: #fff;
  }

  .card-pf {
    font-size: 10px;
    color: #6b7194;
    font-variant-numeric: tabular-nums;
  }

  .card-pf.fire { color: #dd622d; }

  .card-items {
    display: flex;
    flex: 1;
    padding: 0 8px 8px;
    gap: 6px;
  }

  .card-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    min-width: 0;
  }

  .card-item-img {
    width: 80px;
    height: 60px;
    object-fit: contain;
    border-radius: 4px;
  }

  .card-item-name {
    font-size: 10px;
    color: #8b90b0;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
    line-height: 1.2;
  }

  .card-item-price {
    font-size: 12px;
    font-weight: 700;
    color: #21d07a;
  }

  .empty {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    color: #6b7194;
    font-size: 14px;
  }
</style>
</head>
<body>
<div class="feed" id="feed">
  <div class="empty" id="empty-msg">Aguardando resultados...</div>
</div>

<script>
(function () {
  var feed = document.getElementById('feed');
  var emptyMsg = document.getElementById('empty-msg');
  var MAX_CARDS = 20;

  function colorToRgba(color, alpha) {
    var m = color.match(/rgb\(\s*(\d+),\s*(\d+),\s*(\d+)\s*\)/);
    if (m) return 'rgba(' + m[1] + ',' + m[2] + ',' + m[3] + ',' + alpha + ')';
    if (color.charAt(0) === '#') {
      var hex = color.replace('#', '');
      if (hex.length === 3) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
      var r = parseInt(hex.substr(0,2), 16);
      var g = parseInt(hex.substr(2,2), 16);
      var b = parseInt(hex.substr(4,2), 16);
      return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
    }
    return color;
  }

  function getRarityClass(entry) {
    var itemName = (entry.itemTo && entry.itemTo.name) ? entry.itemTo.name : '';
    var toPrice = 0;
    if (entry.itemTo && entry.itemTo.price) {
      toPrice = parseFloat(String(entry.itemTo.price).replace(/[^0-9.,]/g, '').replace(',', '.')) || 0;
    }
    // Knives/gloves = gold
    if (itemName.indexOf('\u2605') !== -1 || itemName.indexOf('Knife') !== -1 || itemName.indexOf('Gloves') !== -1 || itemName.indexOf('Bayonet') !== -1 || itemName.indexOf('Karambit') !== -1 || itemName.indexOf('Butterfly') !== -1 || itemName.indexOf('Talon') !== -1 || itemName.indexOf('Skeleton') !== -1 || itemName.indexOf('Navaja') !== -1 || itemName.indexOf('Stiletto') !== -1 || itemName.indexOf('Ursus') !== -1 || itemName.indexOf('Bowie') !== -1 || itemName.indexOf('Falchion') !== -1 || itemName.indexOf('Huntsman') !== -1 || itemName.indexOf('Gut Knife') !== -1 || itemName.indexOf('Flip Knife') !== -1 || itemName.indexOf('M9 Bayonet') !== -1 || itemName.indexOf('Kukri') !== -1) {
      return 'rarity-gold';
    }
    if (toPrice >= 300) return 'rarity-gold';
    if (toPrice >= 80) return 'rarity-covert';
    if (toPrice >= 25) return 'rarity-classified';
    if (toPrice >= 8) return 'rarity-restricted';
    if (toPrice >= 2) return 'rarity-milspec';
    if (toPrice >= 0.5) return 'rarity-industrial';
    return 'rarity-consumer';
  }

  function createCard(entry) {
    var card = document.createElement('div');
    card.className = 'card ' + getRarityClass(entry);

    var isCase = entry.type === 'case';
    var pfClass = entry.pfRoll && entry.pfRoll >= 9000000 ? ' fire' : '';
    var pfText = entry.pfRoll ? String(Math.round(entry.pfRoll)) : '';

    var badgeHtml = isCase
      ? '<span class="card-type-badge card-badge-case">CASE</span>'
      : '<span class="card-type-badge card-badge-upgrade">UPGRADE</span>';

    var caseNameHtml = '';
    if (isCase && entry.caseName) {
      var prettyCase = entry.caseName.replace(/-/g, ' ').replace(/\b\w/g, function(c) { return c.toUpperCase(); });
      caseNameHtml = '<span class="card-case-name">' + prettyCase + '</span>';
    }

    var fromHtml = '';
    var toHtml = '';

    if (entry.itemFrom) {
      fromHtml = '<div class="card-item">'
        + (entry.itemFrom.image ? '<img class="card-item-img" src="' + entry.itemFrom.image + '" alt="">' : '')
        + '<div class="card-item-name">' + (entry.itemFrom.name || '') + '</div>'
        + '<div class="card-item-price">$ ' + (entry.itemFrom.price || '0.00') + '</div>'
        + '</div>';
    }

    if (entry.itemTo) {
      toHtml = '<div class="card-item">'
        + (entry.itemTo.image ? '<img class="card-item-img" src="' + entry.itemTo.image + '" alt="">' : '')
        + '<div class="card-item-name">' + (entry.itemTo.name || '') + '</div>'
        + '<div class="card-item-price">$ ' + (entry.itemTo.price || '0.00') + '</div>'
        + '</div>';
    }

    card.innerHTML = '<div class="card-header">'
      + '<div class="card-user">'
      + (entry.avatar ? '<img class="card-avatar" src="' + entry.avatar + '" alt="">' : '<div class="card-avatar"></div>')
      + '<span class="card-username">' + (entry.username || 'Anônimo') + '</span>'
      + '</div>'
      + '<div class="card-stats">'
      + badgeHtml
      + caseNameHtml
      + '<span class="card-multiplier">' + (entry.multiplier || '') + '</span>'
      + (pfText ? '<span class="card-pf' + pfClass + '">' + pfText + '</span>' : '')
      + '</div>'
      + '</div>'
      + '<div class="card-items">' + fromHtml + toHtml + '</div>';

    return card;
  }

  function addCard(entry) {
    if (emptyMsg) { emptyMsg.remove(); emptyMsg = null; }

    var card = createCard(entry);
    feed.insertBefore(card, feed.firstChild);

    // Remove excess cards
    while (feed.children.length > MAX_CARDS) {
      feed.removeChild(feed.lastChild);
    }
  }

  // Connect to Socket.IO
  var socket = io({ transports: ['websocket', 'polling'] });

  socket.on('connect', function () {
    console.log('CPH LiveDrop connected');
  });

  socket.on('new-roll', function (entry) {
    addCard(entry);
  });

  // Load existing rolls on page load
  fetch('/api/rolls')
    .then(function (res) { return res.json(); })
    .then(function (data) {
      if (data && data.length) {
        // Reverse so oldest appears first, then newest slides in
        data.slice().reverse().forEach(function (entry) {
          addCard(entry);
        });
      }
    })
    .catch(function (err) {
      console.error('Failed to load rolls:', err);
    });
})();
</script>
</body>
</html>
